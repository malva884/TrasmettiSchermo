<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Orologio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden;
               font-family: "Segoe UI", system-ui, sans-serif; }
  body {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center;
    transition: background .4s, color .4s;
  }
  body.dark  { background: radial-gradient(ellipse at 50% 30%, #16213e 0%, #0b0f1a 70%);
               color: #f1f5f9; }
  body.light { background: linear-gradient(160deg, #f8fafc, #e2e8f0);
               color: #0f172a; }
  #title {
    font-size: 3.2vw; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; opacity: .65; margin-bottom: 2.5vh;
    max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  #time {
    font-size: 19vw; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  body.dark  #time { text-shadow: 0 0 4vw rgba(94, 234, 212, .25); color: #f8fafc; }
  body.light #time { color: #0f172a; }
  #time .sec { font-size: .32em; font-weight: 600; opacity: .55; margin-left: .08em; }
  #date { font-size: 4.6vw; font-weight: 500; opacity: .85; margin-top: 1vh; }
  #date .cap { text-transform: capitalize; }
  #bar {
    margin-top: 4vh; height: .6vh; width: 22vw; border-radius: 999px;
    background: linear-gradient(90deg, #6366f1, #5eead4);
  }
</style>
</head>
<body>
<div id="title"></div>
<div id="time"></div>
<div id="date"></div>
<div id="bar"></div>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var title = q.get('title') || '';
  var theme = (q.get('theme') || 'dark').toLowerCase();
  var showSec = q.get('show_seconds') === '1';

  document.body.className = theme === 'light' ? 'light' : 'dark';
  document.getElementById('title').textContent = title;
  document.getElementById('title').style.display = title ? '' : 'none';

  var GIORNI = ['domenica', 'lunedì', 'martedì', 'mercoledì',
                'giovedì', 'venerdì', 'sabato'];
  var MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio',
              'giugno', 'luglio', 'agosto', 'settembre',
              'ottobre', 'novembre', 'dicembre'];
  var timeEl = document.getElementById('time');
  var dateEl = document.getElementById('date');

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function tick() {
    var d = new Date();
    timeEl.innerHTML = pad(d.getHours()) + ':' + pad(d.getMinutes()) +
      (showSec ? '<span class="sec">' + pad(d.getSeconds()) + '</span>' : '');
    dateEl.innerHTML =
      '<span class="cap">' + GIORNI[d.getDay()] + '</span> ' +
      d.getDate() + ' <span class="cap">' + MESI[d.getMonth()] + '</span> ' +
      d.getFullYear();
  }
  tick();
  setInterval(tick, 250);
})();
</script>
</body>
</html>
